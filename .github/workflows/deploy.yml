name: deploy

# Keron: deploys the relay (edge/) to the owner's Cloudflare account, and only
# when run by hand. Usually the owner deploys from a terminal instead
# (edge/RELAY.md). Skips the deploy step until the CLOUDFLARE_API_TOKEN secret
# is configured on the fork.
#
# The token needs: Workers Scripts (edit), Workers Routes (edit) on the
# relay's zone, Workers R2 Storage (edit). Account id is in edge/wrangler.jsonc.
# Zeron's landing and www-redirect sites are not Keron's and never deploy.

on:
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `github.event.before` may precede several commits in a batched push.
          fetch-depth: 0
      - name: detect edge changes
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE "^(edge/|\.github/workflows/deploy\.yml)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: install
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm ci
      - name: typecheck
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm run typecheck
      - name: test
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm test
      - name: deploy
        if: steps.changed.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: edge
        run: npx wrangler deploy

  # Zeron's static landing page: not part of Keron, never deployed from the fork.
  landing:
    if: false
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: detect landing changes
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE "^(apps/landing/|\.github/workflows/deploy\.yml)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
      - name: test
        if: steps.changed.outputs.changed == 'true'
        working-directory: apps/landing
        run: node --test *.test.mjs
      - name: deploy
        if: steps.changed.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/landing
        run: npx wrangler@4 deploy

  # Zeron's www redirect: not part of Keron, never deployed from the fork.
  www-redirect:
    if: false
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: detect www-redirect changes
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE "^(apps/www-redirect/|\.github/workflows/deploy\.yml)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
      - name: deploy
        if: steps.changed.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/www-redirect
        run: npx wrangler@4 deploy
